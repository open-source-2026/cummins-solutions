<mat-card>

  <mat-card-header>

    <mat-card-title>{{hub.name}}</mat-card-title>
    <mat-card-subtitle></mat-card-subtitle>

  </mat-card-header>

  <mat-card-content>

    @for (item of items; track item.id) {
      <p>{{ item.componentName }}: {{ item.quantity }}</p>
    } @empty {
      <p>{{ 'empty' | translate }}</p>
    }
  </mat-card-content>

  <mat-card-footer>

    <p>{{ 'total-components' | translate }}: {{ totalComponents }}</p>
    <p>{{ 'available-capacity' | translate }}: {{ availableCapacity }}</p>

  </mat-card-footer>

</mat-card>
